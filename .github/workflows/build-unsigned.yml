name: Build OpenFlux Custom unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_openflux.py'
      - '.github/workflows/build-unsigned.yml'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6

      - name: Checkout OpenFlux upstream
        run: git clone --depth 1 https://github.com/p1neappleXpress/OpenFlux.git OpenFlux

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Setup Go 1.26
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: OpenFlux/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply custom direct-domain patch
            - name: Apply custom app icon
        working-directory: OpenFlux/ios-app
        run: |
          ICON_SRC="$GITHUB_WORKSPACE/app-icon.png"

          if [ ! -f "$ICON_SRC" ]; then
            echo "app-icon.png not found in repository root"
            exit 1
          fi

          ASSETS_DIR="$(find . -type d -name Assets.xcassets | head -n 1)"

          if [ -z "$ASSETS_DIR" ]; then
            echo "Assets.xcassets not found"
            exit 1
          fi

          APPICON_DIR="$ASSETS_DIR/AppIcon.appiconset"

          rm -rf "$APPICON_DIR"
          mkdir -p "$APPICON_DIR"

          resize() {
            local size="$1"
            local output="$2"
            sips -z "$size" "$size" "$ICON_SRC" --out "$APPICON_DIR/$output" >/dev/null
          }

          resize 40 Icon-20@2x.png
          resize 60 Icon-20@3x.png
          resize 58 Icon-29@2x.png
          resize 87 Icon-29@3x.png
          resize 80 Icon-40@2x.png
          resize 120 Icon-40@3x.png
          resize 120 Icon-60@2x.png
          resize 180 Icon-60@3x.png

          resize 20 Icon-20@1x-ipad.png
          resize 40 Icon-20@2x-ipad.png
          resize 29 Icon-29@1x-ipad.png
          resize 58 Icon-29@2x-ipad.png
          resize 40 Icon-40@1x-ipad.png
          resize 80 Icon-40@2x-ipad.png
          resize 76 Icon-76@1x.png
          resize 152 Icon-76@2x.png
          resize 167 Icon-83.5@2x.png
          resize 1024 Icon-1024@1x.png

          cat > "$APPICON_DIR/Contents.json" <<'JSON'
          {
            "images" : [
              { "idiom" : "iphone", "size" : "20x20", "scale" : "2x", "filename" : "Icon-20@2x.png" },
              { "idiom" : "iphone", "size" : "20x20", "scale" : "3x", "filename" : "Icon-20@3x.png" },
              { "idiom" : "iphone", "size" : "29x29", "scale" : "2x", "filename" : "Icon-29@2x.png" },
              { "idiom" : "iphone", "size" : "29x29", "scale" : "3x", "filename" : "Icon-29@3x.png" },
              { "idiom" : "iphone", "size" : "40x40", "scale" : "2x", "filename" : "Icon-40@2x.png" },
              { "idiom" : "iphone", "size" : "40x40", "scale" : "3x", "filename" : "Icon-40@3x.png" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "2x", "filename" : "Icon-60@2x.png" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "3x", "filename" : "Icon-60@3x.png" },

              { "idiom" : "ipad", "size" : "20x20", "scale" : "1x", "filename" : "Icon-20@1x-ipad.png" },
              { "idiom" : "ipad", "size" : "20x20", "scale" : "2x", "filename" : "Icon-20@2x-ipad.png" },
              { "idiom" : "ipad", "size" : "29x29", "scale" : "1x", "filename" : "Icon-29@1x-ipad.png" },
              { "idiom" : "ipad", "size" : "29x29", "scale" : "2x", "filename" : "Icon-29@2x-ipad.png" },
              { "idiom" : "ipad", "size" : "40x40", "scale" : "1x", "filename" : "Icon-40@1x-ipad.png" },
              { "idiom" : "ipad", "size" : "40x40", "scale" : "2x", "filename" : "Icon-40@2x-ipad.png" },
              { "idiom" : "ipad", "size" : "76x76", "scale" : "1x", "filename" : "Icon-76@1x.png" },
              { "idiom" : "ipad", "size" : "76x76", "scale" : "2x", "filename" : "Icon-76@2x.png" },
              { "idiom" : "ipad", "size" : "83.5x83.5", "scale" : "2x", "filename" : "Icon-83.5@2x.png" },

              { "idiom" : "ios-marketing", "size" : "1024x1024", "scale" : "1x", "filename" : "Icon-1024@1x.png" }
            ],
            "info" : {
              "version" : 1,
              "author" : "xcode"
            }
          }
          JSON

          echo "Custom icon applied to: $APPICON_DIR"
        run: python3 patch_openflux.py OpenFlux

      - name: Build OpenFlux Go library for iOS
        working-directory: OpenFlux
        run: ./build_ios.sh

      - name: Sync native library and generate Xcode project
        working-directory: OpenFlux
        run: |
          mkdir -p ios-app/Lib
          cp output/ios/liboflux.a ios-app/Lib/liboflux.a
          cp output/ios/liboflux.h ios-app/Lib/liboflux.h
          cd ios-app
          xcodegen generate

      - name: Build without code signing
        working-directory: OpenFlux/ios-app
        run: |
          rm -rf build/DerivedData
          xcodebuild \
            -project OpenFlux.xcodeproj \
            -scheme OpenFlux \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            clean build

      - name: Package unsigned IPA
        working-directory: OpenFlux/ios-app
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name 'OpenFlux.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH/PlugIns/OpenFluxTunnel.appex"
          rm -rf unsigned Payload
          mkdir -p unsigned/Payload
          cp -R "$APP_PATH" unsigned/Payload/OpenFlux.app
          cd unsigned
          /usr/bin/zip -qry ../OpenFlux-Custom-unsigned.ipa Payload
          cd ..
          shasum -a 256 OpenFlux-Custom-unsigned.ipa > OpenFlux-Custom-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: OpenFlux-Custom-unsigned
          path: |
            OpenFlux/ios-app/OpenFlux-Custom-unsigned.ipa
            OpenFlux/ios-app/OpenFlux-Custom-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30
